services:
  mongo:
    image: mongo:latest 
    restart: unless-stopped
    entrypoint: >
      bash -c "mongod --port ${DB_PORT:-27017} --replSet rs0 --bind_ip 0.0.0.0 & 
      MONGOD_PID=\$$!; 
      until mongosh admin --port ${DB_PORT:-27017} --eval 'rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:${DB_PORT:-27017}\" }] })' > /dev/null 2>&1; do 
        echo 'Waiting for mongod to be ready...'; 
        sleep 1; 
      done; 
      echo 'REPLICA SET ONLINE'; 
      wait \$$MONGOD_PID"
    volumes:
      - db-data:/data/db
    ports:
      - "${DB_PORT:-27017}:${DB_PORT:-27017}"

  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
  
  minio:
    image: minio/minio:latest
    command: server /data
    volumes:
      - "upload-data:/data"
    environment:
      - "MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}"
      - "MINIO_ROOT_PASSWORD=${S3_ACCESS_KEY_SECRET}"
    ports:
      - "${MINIO_PORT:-9000}:9000"

volumes:
  db-data:
  upload-data: